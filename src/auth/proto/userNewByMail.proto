syntax="proto3";

package auth;

message UserNewByMailReq {
  string mail=1;
  string name=2;
  string password=3;
  string verify_code=4;
}

enum UserNewByMailErr {
  OK=0;
  ERR_MAIL_EXIST=1;
  ERR_VERIFY_CODE=2;
}

message UserNewByMail {
  optional uint64 uid=1;
  optional UserNewByMailErr err=2;
}
